<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="Stake.css">
</head>

<body>

  <div class="stake-layout">

    <!-- Main Stake Section -->
    <main class="stake-page">
      <div class="stake-container">

        <!-- Stake Amount Section -->
        <div class="stake-section">
          <label class="input-label">Select Stake Amount</label>

          <!-- Stake Option 1 -->
          <div class="input-wrapper">
            <span class="stake-label">5 Birr</span>
            <button class="btn btn-stake" data-amount="100">Play</button>
          </div>

          <!-- Stake Option 2 -->
          <div class="input-wrapper">
            <span class="stake-label">10 Birr</span>
            <button class="btn btn-stake" data-amount="500">Play</button>
          </div>

          <!-- Stake Option 3 -->
          <div class="input-wrapper">
            <span class="stake-label">20 Birr</span>
            <button class="btn btn-stake" data-amount="1000">Play</button>
          </div>

          <!-- Stake Option 4 -->
          <div class="input-wrapper">
            <span class="stake-label">50 Birr</span>
            <button class="btn btn-stake" data-amount="5000">Play</button>
          </div>

        </div>
      </div>
    </main>


    <!-- Platform Statistics -->
    <section class="stake-stats" aria-label="Platform statistics">

      <div class="stat-item">
        <div class="stat-number">45,000+</div>
        <div class="stat-label">Active Players</div>
      </div>

      <div class="stat-item">
        <div class="stat-number">60,000+</div>
        <div class="stat-label">Games Played</div>
      </div>

      <div class="stat-item">
        <div class="stat-number">500+</div>
        <div class="stat-label">Winners Daily</div>
      </div>

    </section>

  </div>

  <script src="Stake.js"></script>

</body>
</html>
